  <!-- JSON-LD Structured Data - FAQ for AEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Devmer?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Devmer is an open-source Infrastructure as Code (IaC) platform built in Rust. It allows you to define, deploy, and manage cloud infrastructure using familiar programming languages like Python, TypeScript, Go, or Rust, instead of configuration files. Unlike other IaC tools, Devmer is fully self-hosted with no vendor lock-in."
        }
      },
      {
        "@type": "Question",
        "name": "How is Devmer different from Terraform?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Devmer differs from Terraform in several key ways: 1) It uses real programming languages instead of HCL configuration files, giving you loops, conditionals, and abstractions. 2) It's fully self-hosted - you control your state storage (S3, PostgreSQL, etc.) with no required cloud service. 3) It's built in Rust for superior performance. 4) It includes built-in secrets encryption and SOC2 compliance features."
        }
      },
      {
        "@type": "Question",
        "name": "How is Devmer different from Pulumi?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "While both Devmer and Pulumi use programming languages for IaC, Devmer is fully self-hosted with no required cloud service. Your state stays in your infrastructure (S3, PostgreSQL, etc.). Devmer also offers a Terminal UI for deployment visualization, built-in HCL migration tools, and is completely open-source with an Apache 2.0 license."
        }
      },
      {
        "@type": "Question",
        "name": "What programming languages does Devmer support?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Devmer supports Python, TypeScript/JavaScript (including Node.js, Deno, and Bun runtimes), Go, and Rust scripting via Rhai. This allows teams to use their preferred language and existing skills to define infrastructure."
        }
      },
      {
        "@type": "Question",
        "name": "Where does Devmer store state?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Devmer supports multiple self-hosted state backends: AWS S3 with DynamoDB locking, Google Cloud Storage, Azure Blob Storage, PostgreSQL, MySQL/MariaDB, Redis, etcd, HashiCorp Consul, MinIO, Git repositories, and Kubernetes ConfigMaps/Secrets. You maintain full control over your infrastructure state."
        }
      },
      {
        "@type": "Question",
        "name": "Is Devmer free to use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, Devmer Community Edition is completely free and open-source under the Apache 2.0 license. It includes the full IaC engine, all language SDKs, and state backends. Team and Enterprise editions are available for organizations needing collaboration features, advanced compliance, and priority support."
        }
      },
      {
        "@type": "Question",
        "name": "Can I migrate from Terraform to Devmer?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, Devmer includes migration tools to help you transition from Terraform, OpenTofu, or Pulumi. The HCL converter can transform your existing Terraform configurations into Devmer code in your preferred programming language, and the state importer can migrate your existing infrastructure state."
        }
      },
      {
        "@type": "Question",
        "name": "What cloud providers does Devmer support?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Devmer supports major cloud providers including AWS, Google Cloud Platform (GCP), and Microsoft Azure. It also supports Kubernetes, and the provider system is extensible so you can create custom providers for any API or service."
        }
      }
