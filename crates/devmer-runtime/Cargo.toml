[package]
name = "devmer-runtime"
description = "Language runtime abstraction for Devmer - runs TypeScript, Python, Go, and Rhai programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

devmer-core.workspace = true
devmer-config.workspace = true
devmer-rpc.workspace = true

# Process spawning
tokio-process = "0.2"

# IPC
interprocess = "2.2"

# Rhai scripting engine (embedded)
rhai = { version = "1.20", features = ["sync", "metadata"] }

# Temporary directories
tempfile = "3.14"

# Path utilities  
which = "7.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
